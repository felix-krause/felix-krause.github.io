about_content: | # this will include new lines to allow paragraphs
  Als Technical Consultant bringe ich über 10 Jahre Erfahrung in der Entwicklung und Architektur komplexer Webanwendungen mit. Mein technisches Fundament bilden <mark>.NET/C#</mark> und moderne <mark>Frontend-Frameworks (React, Angular)</mark>, ergänzt durch tiefes Verständnis für <mark>CI/CD-Pipelines, Build-Optimierung und Deployment-Automatisierung</mark>. In meiner letzten Rolle als Lead Developer und Software Architect habe ich agile Entwicklungsteams geführt, kritische Features selbst umgesetzt und dabei stets Wert auf <mark>nachhaltige Architektur, Barrierefreiheit (AX) und benutzerzentrierte Gestaltung (UX)</mark> gelegt. 
  
  Ich bin es gewohnt, nicht nur zu konzipieren, sondern auch zu liefern – und verstehe die gesamte Delivery-Pipeline von der IDE bis zur Produktion.
