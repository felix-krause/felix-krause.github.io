  - title: Persönliche Vorlieben
    layout: text
    content: | # this will include new lines to allow paragraphs
      Felix geht seinem Interesse im Software Engineering oft auch privat nach.
      Seine ständige Begleiterin dabei ist seine Katze, die dabei auf einer selbstentwickelten Tastaturabdeckung schläft.
      Falls er daneben etwas Zeit findet, geht er gerne fernab von jeder Autobahn oder Zuglinie wandern, spielt gerne uralte und brandneue Brettspiele und macht [Musik](https://youtu.be/4hN3P9NMQLs).
      Felix trinkt lieber Tee als Kaffee, trinkt sein Wasser lieber mit Sprudel als ohne und isst lieber Pizza als Spaghetti.

